name: Addon release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: addon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      release_artifact: addon-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Build and verify tagged release archives
        run: ./gradlew prepareAddonRelease -PcompuktersDependencyMode=release --no-daemon --parallel --max-workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/
            build/release-tools/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.release_artifact }}
          path: build
      - name: Publish verified GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/release-tools/addon_release.py github --directory build/release
